# PII service API automation.
# - Pull requests: static checks + unit tests only (no secrets exposed to PR code from forks).
# - Scheduled (Mon–Fri IST, see `schedule`) and manual runs: Aisle PII facade suites (QA → Aisle → PII service → DB) against a chosen
#   environment, using GitHub Environment secrets (AISLE_TEST_TOKEN). The report is then emailed with every
#   PDF page shown inline (scripts/send-report-mail.ts) to the REPORT_MAIL_TO list.
name: PII API tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (GitHub Environment name holding the secrets)
        type: choice
        options: [staging, qa]
        default: staging
      suite:
        description: npm script to run
        type: choice
        options: [test:smoke, test:phase1, test:regression, test:security, test:db, test:api]
        default: test:smoke
      send_email:
        description: Email the report to REPORT_MAIL_TO
        type: boolean
        default: true
  schedule:
    # 02:00 IST Mon–Fri = 20:30 UTC the evening before (Sun–Thu). Set 6 h before the wanted 08:00 IST because
    # GitHub has been starting scheduled runs ~6 h late. If GitHub runs on time, the run happens at 02:00 IST.
    # Full npm run test:all on the Aisle staging facade + email. Weekend runs are also skipped by `schedule-gate`.
    - cron: '30 20 * * 0-4'

permissions:
  contents: read

concurrency:
  group: pii-api-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    # Scheduled runs that start on a Saturday or Sunday in IST (e.g. a late-delayed run) are skipped.
    # Pull requests and manual runs always continue.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        env:
          EVENT: ${{ github.event_name }}
        run: |
          DOW=$(TZ=Asia/Kolkata date +%u) # 1 = Monday … 7 = Sunday
          if [ "$EVENT" = "schedule" ] && [ "$DOW" -ge 6 ]; then
            echo "Weekend in IST ($(TZ=Asia/Kolkata date '+%a %d %b %H:%M')): skipping the scheduled run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: reports/
          retention-days: 7

  report-tests:
    # Tests the reporting layer (dashboard UI, exports, PDF, redaction) against SYNTHETIC fixtures.
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run report:test
      - name: Demo dashboard + PDF (clearly labelled DEMO DATA)
        run: npm run report:demo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-tests
          path: |
            reports/report-tests-html/
            reports/demo-report/
          retention-days: 7

  integration:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'staging' }}
    env:
      CI: 'true'
      PII_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      # QA tests ONLY the Aisle PII facade (QA → Aisle → PII service → DB). No PII-service keys or tenants.
      AISLE_BASE_URL: ${{ vars.AISLE_BASE_URL || 'https://testa2.aisle.co/V1' }}
      # The Aisle test token is a secret: GitHub masks it, and the framework never prints it.
      AISLE_TEST_TOKEN: ${{ secrets.AISLE_TEST_TOKEN }}
      AISLE_TEST_EMAIL_DOMAIN: ${{ vars.AISLE_TEST_EMAIL_DOMAIN || 'example.test' }}
      AISLE_TEST_PHONES: ${{ secrets.AISLE_TEST_PHONES }}
      DB_ENGINE: ${{ vars.DB_ENGINE || 'none' }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_READONLY_PASSWORD }}
      DB_QUERIES_FILE: config/db-queries.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write SQL catalog from secret (optional)
        if: env.DB_ENGINE != 'none'
        env:
          DB_QUERIES_JSON: ${{ secrets.DB_QUERIES_JSON }}
        run: printf '%s' "$DB_QUERIES_JSON" > config/db-queries.json
      # Before check-env so the failure email can still be built if configuration is wrong.
      - run: npx playwright install --with-deps chromium
      - name: Validate configuration
        run: npm run check-env
      - name: Restore run history (trends, comparisons, flaky detection)
        uses: actions/cache/restore@v4
        with:
          path: reports/history
          key: pii-history-${{ inputs.environment || 'staging' }}-${{ github.run_id }}
          restore-keys: pii-history-${{ inputs.environment || 'staging' }}-
      - name: Test → collect → analyse → dashboard → PDF
        # test:all always generates the report, then exits with the TEST exit code.
        run: |
          case "${{ inputs.suite || 'test:api' }}" in
            test:smoke)      ARGS="--project=api --grep @smoke" ;;
            test:phase1)     ARGS="--project=api --grep @phase1" ;;
            test:security)   ARGS="--project=api --grep @security" ;;
            test:db)         ARGS="--project=api --grep @db" ;;
            test:regression) ARGS="--project=api --grep @regression" ;;
            *)               ARGS="--project=api" ;;
          esac
          npm run test:all -- $ARGS
      - name: Save run history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/history
          key: pii-history-${{ inputs.environment || 'staging' }}-${{ github.run_id }}
      - name: Job summary
        if: always()
        run: |
          if [ -f reports/qa-report/summary.txt ]; then
            { echo '```'; cat reports/qa-report/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Email the report (every PDF page inline, no attachment)
        if: always() && (github.event_name == 'schedule' || inputs.send_email)
        env:
          # Microsoft 365: a service mailbox with SMTP AUTH enabled. Recipients: comma-separated, add more any time.
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.office365.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_MAIL_FROM: ${{ vars.REPORT_MAIL_FROM }}
          REPORT_MAIL_TO: ${{ vars.REPORT_MAIL_TO || 'vidhey.bhogadi@infoedge.com' }}
        run: npm run report:mail
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          # PII Sentinel dashboard: index.html, assets/, data/, report.pdf, results.json, results.csv, summary.txt.
          # Contains only sanitized metadata — no bodies, traces, keys or personal data.
          name: qa-report-${{ inputs.environment || 'staging' }}-${{ github.run_id }}
          path: reports/qa-report/
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raw-${{ inputs.environment || 'staging' }}-${{ github.run_id }}
          path: |
            reports/junit/
            reports/json/
            reports/latest/
          retention-days: 14
